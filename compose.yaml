name: cybercompany-poc

x-agent-env: &agent-env
  COMPANY_URL: http://server:8000
  CODEX_MODEL: ${CODEX_MODEL:-gpt-6-luna}
  CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-medium}

x-agent: &agent
  build:
    context: .
    dockerfile: agent/Dockerfile
  restart: unless-stopped
  depends_on:
    server:
      condition: service_healthy
  environment: *agent-env
  mem_limit: 1536m
  cpus: 2
  pids_limit: 256
  cap_drop: [ALL]
  cap_add: [DAC_OVERRIDE]
  security_opt: [no-new-privileges:true]
  volumes:
    - ${CODEX_AUTH_FILE:-./secrets/auth.json}:/run/secrets/codex-auth.json:ro

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CYBERCOMPANY_PORT:-8765}:8000"
    volumes:
      - ./data:/data
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 3s
      timeout: 3s
      retries: 20
  manager:
    <<: *agent
    environment:
      <<: *agent-env
      AGENT_NAME: manager
    volumes:
      - ${CODEX_AUTH_FILE:-./secrets/auth.json}:/run/secrets/codex-auth.json:ro
      - ./data/agents/manager:/home/agent
      - ./data/views/manager/chats:/home/agent/chats:ro
      - ./data/views/manager/members:/home/agent/members:ro
      - ./data/views/manager/kanban:/home/agent/kanban:ro
  dev1:
    <<: *agent
    environment:
      <<: *agent-env
      AGENT_NAME: dev1
    volumes:
