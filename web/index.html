<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cyber Company</title><link rel="stylesheet" href="/static/style.css"></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span class="mark">◇</span><div><strong>Cyber Company</strong><small>本机实验公司</small></div></div><div class="section"><div class="section-title">群聊 <button id="new-thread" title="创建群聊">＋</button></div><div id="threads"></div></div><div class="section"><div class="section-title">私聊</div><div id="dms"></div></div><div class="section"><div class="section-title">成员</div><div id="members"></div></div><div class="section"><div class="section-title">看板 <button id="new-board" title="创建看板">＋</button></div><div id="boards"></div></div></aside>
<main><header><div><h1 id="channel-title">公司大厅</h1><p id="channel-subtitle">选择一个讨论串</p></div><span class="live">● 本机运行</span></header><div id="messages" class="messages"></div><form id="message-form"><textarea id="message-input" placeholder="给团队发消息。用 @manager 等名字点名…" rows="2"></textarea><button type="submit">发送 ↗</button></form></main>
<aside class="details"><div class="section-title">当前讨论串</div><div id="participants"></div><div class="divider"></div><div class="section-title">任务 <button id="new-task" title="创建任务">＋</button></div><div id="tasks"></div></aside></div>
<dialog id="modal"><form id="modal-form"><h2 id="modal-title"></h2><div id="modal-fields"></div><div class="modal-actions"><button type="button" id="cancel">取消</button><button type="submit">保存</button></div></form></dialog>
<dialog id="activity-dialog"><div class="activity-header"><div><h2 id="activity-title">员工工作流</h2><p id="activity-status"></p></div><div><button id="activity-dm" type="button">发私聊</button><button id="activity-close" type="button">关闭</button></div></div><div id="activity-feed" class="activity-feed"></div></dialog>
<script src="/static/app.js"></script></body></html>
